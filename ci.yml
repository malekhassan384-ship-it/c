name: CI

on: [push, pull_request]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:perft
      - run: npm run build
      - name: Smoke test (headless Xvfb — boot integrity, NOT a substitute for manual GUI testing)
        run: npm run test:smoke

  engine-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Fetch official Stockfish (linux)
        run: node scripts/fetch-engine.mjs --os linux
      - run: npm run test:integration
