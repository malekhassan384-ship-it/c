name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # STRICT GATE: no release is ever built unless CI quality-gate succeeded
      # on the EXACT commit this tag points to.
      - name: Require CI quality-gate success on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $max = 40; $found = $false
          for ($i = 0; $i -lt $max -and -not $found; $i++) {
            $runs = (Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/commits/$sha/check-runs" -Headers $headers).check_runs
            $ci = $runs | Where-Object { $_.name -eq 'quality-gate' }
            if ($ci -and $ci.status -eq 'completed') {
              if ($ci.conclusion -ne 'success') { Write-Error "CI quality-gate conclusion for $sha is '$($ci.conclusion)' — refusing to release."; exit 1 }
              $found = $true
            } else {
              Write-Host "CI not completed yet for $sha (attempt $($i+1)/$max) — waiting 30s"
              Start-Sleep -Seconds 30
            }
          }
          if (-not $found) { Write-Error "CI quality-gate never succeeded for $sha — refusing to release."; exit 1 }
          Write-Host "GATE PASSED: CI quality-gate succeeded on $sha"

      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:perft
      - run: npm run build
      - name: Fetch official Stockfish (win32)
        run: node scripts/fetch-engine.mjs --os win32
      - run: npm run dist -- --win
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }
          Get-Content dist/*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
